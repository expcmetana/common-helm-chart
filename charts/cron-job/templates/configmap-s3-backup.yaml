{{- if .Values.s3Backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cron-job.fullname" . }}-s3-backup-script
  labels:
    {{- include "cron-job.labels" . | nindent 4 }}
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
    ARCHIVE_NAME="${BACKUP_PREFIX}-${TIMESTAMP}.tar.gz"
    ARCHIVE_FILENAME="$(basename "${ARCHIVE_NAME}")"
    LOCAL_ARCHIVE="/tmp/${ARCHIVE_FILENAME}"
    WORK_DIR="/tmp/backup"

    echo "=========================================="
    echo "S3 Backup - ${TIMESTAMP}"
    echo "=========================================="
    echo "Bucket: ${S3_BUCKET}"
    echo "Endpoint: ${S3_ENDPOINT}"
    echo "Folders: ${BACKUP_FOLDERS}"
    echo "Archive: s3://${S3_BUCKET}/${ARCHIVE_NAME}"
    echo "Retention: ${BACKUP_RETENTION_DAYS} days"
    echo ""

    echo "Validating environment..."
    if [ -z "${S3_ACCESS_KEY_ID}" ] || [ -z "${S3_SECRET_ACCESS_KEY}" ]; then
      echo "ERROR: S3 credentials not set"
      exit 1
    fi
    echo "  ✓ Credentials present"

    if ! command -v aws &> /dev/null; then
      echo "ERROR: AWS CLI not installed"
      exit 1
    fi
    echo "  ✓ AWS CLI found: $(aws --version 2>&1 | head -n1)"
    echo ""

    export AWS_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID}"
    export AWS_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY}"
    export AWS_DEFAULT_REGION="${S3_REGION}"
    export HOME=/tmp

    echo "Testing S3 connection..."
    if ! aws s3 ls "s3://${S3_BUCKET}/" --endpoint-url="${S3_ENDPOINT}" >/dev/null 2>&1; then
      echo "ERROR: Cannot connect to S3 bucket"
      echo "Bucket: ${S3_BUCKET}"
      echo "Endpoint: ${S3_ENDPOINT}"
      aws s3 ls "s3://${S3_BUCKET}/" --endpoint-url="${S3_ENDPOINT}" 2>&1
      exit 1
    fi
    echo "  ✓ S3 connection successful"
    echo ""

    mkdir -p "${WORK_DIR}"
    TOTAL_OBJECTS=0

    for FOLDER in ${BACKUP_FOLDERS}; do
      echo "→ Checking: s3://${S3_BUCKET}/${FOLDER}/"

      # Check if folder exists by trying to list first page
      if ! aws s3 ls "s3://${S3_BUCKET}/${FOLDER}/" \
           --endpoint-url="${S3_ENDPOINT}" \
           --max-items 1 >/dev/null 2>&1; then
        echo "  ⚠️  Folder does not exist, skipping"
        continue
      fi

      # Count objects in folder
      OBJECT_COUNT=$(aws s3 ls "s3://${S3_BUCKET}/${FOLDER}/" \
        --endpoint-url="${S3_ENDPOINT}" \
        --recursive | wc -l | tr -d '[:space:]')

      if [ "${OBJECT_COUNT}" -eq "0" ]; then
        echo "  ⚠️  Folder is empty, skipping"
        continue
      fi

      echo "  ✓ Found ${OBJECT_COUNT} objects"
      mkdir -p "${WORK_DIR}/${FOLDER}"

      echo "  Downloading files..."
      aws s3 sync "s3://${S3_BUCKET}/${FOLDER}/" "${WORK_DIR}/${FOLDER}/" \
        --endpoint-url="${S3_ENDPOINT}" \
        --no-progress

      DOWNLOADED=$(find "${WORK_DIR}/${FOLDER}" -type f 2>/dev/null | wc -l | tr -d '[:space:]')
      echo "  ✓ Downloaded ${DOWNLOADED} files"

      TOTAL_OBJECTS=$((TOTAL_OBJECTS + DOWNLOADED))
    done

    if [ "${TOTAL_OBJECTS}" -eq "0" ]; then
      echo "No data to backup"
      exit 0
    fi

    echo ""
    echo "→ Creating archive: ${ARCHIVE_FILENAME}"
    tar -czf "${LOCAL_ARCHIVE}" -C "${WORK_DIR}" .

    ARCHIVE_SIZE=$(du -h "${LOCAL_ARCHIVE}" 2>/dev/null | cut -f1)
    echo "  Archive size: ${ARCHIVE_SIZE}"

    echo "→ Uploading to S3"
    aws s3 cp "${LOCAL_ARCHIVE}" "s3://${S3_BUCKET}/${ARCHIVE_NAME}" \
      --endpoint-url="${S3_ENDPOINT}" \
      --no-progress \
      --only-show-errors

    echo "  ✓ Upload complete"

    rm -rf "${WORK_DIR}" "${LOCAL_ARCHIVE}"

    echo ""
    echo "=========================================="
    echo "Retention cleanup (>${BACKUP_RETENTION_DAYS} days)"
    echo "=========================================="

    RETENTION_DATE=$(date -d "${BACKUP_RETENTION_DAYS} days ago" +%Y-%m-%d 2>/dev/null || \
                     date -v-${BACKUP_RETENTION_DAYS}d +%Y-%m-%d 2>/dev/null)
    RETENTION_TIMESTAMP="${RETENTION_DATE}_00-00-00"

    BACKUP_PREFIX_BASENAME=$(basename "${BACKUP_PREFIX}")
    BACKUP_PREFIX_DIR=$(dirname "${BACKUP_PREFIX}")

    if [ "${BACKUP_PREFIX_DIR}" = "." ]; then
      S3_LIST_PREFIX=""
    else
      S3_LIST_PREFIX="${BACKUP_PREFIX_DIR}/"
    fi

    BACKUP_FILES=$(aws s3 ls "s3://${S3_BUCKET}/${S3_LIST_PREFIX}" \
      --endpoint-url="${S3_ENDPOINT}" 2>/dev/null | \
      grep "${BACKUP_PREFIX_BASENAME}-" | awk '{print $4}' || echo "")

    if [ -z "${BACKUP_FILES}" ]; then
      echo "No old backups found"
    else
      DELETED=0
      for FILE in ${BACKUP_FILES}; do
        FILE_TIMESTAMP=$(echo "${FILE}" | sed "s/${BACKUP_PREFIX_BASENAME}-//;s/.tar.gz//")
        if [[ "${FILE_TIMESTAMP}" < "${RETENTION_TIMESTAMP}" ]]; then
          echo "Delete: ${S3_LIST_PREFIX}${FILE}"
          aws s3 rm "s3://${S3_BUCKET}/${S3_LIST_PREFIX}${FILE}" \
            --endpoint-url="${S3_ENDPOINT}" \
            --only-show-errors
          DELETED=$((DELETED + 1))
        fi
      done

      if [ "${DELETED}" -eq "0" ]; then
        echo "No old backups to delete"
      else
        echo "✓ Deleted ${DELETED} old backup(s)"
      fi
    fi

    echo ""
    echo "✓ Backup completed - $(date +%Y-%m-%d_%H:%M:%S)"
{{- end }}
