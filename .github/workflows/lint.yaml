name: Lint and Test

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"
  push:
    branches:
      - main
      - develop
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint charts/

  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint all charts
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart"
              helm lint "$chart" --strict
            fi
          done

      - name: Template all charts
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Templating $chart_name"
              helm template test-release "$chart" \
                --set image.repository=busybox \
                --set image.tag=latest \
                --set 'command[0]=/bin/sh' \
                --set 'args[0]=echo test' || echo "Template failed for $chart_name (might need different values)"
            fi
          done

  test-install:
    name: Test Chart Installation
    runs-on: ubuntu-latest
    needs: [lint-yaml, lint-helm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s

      - name: Test cron-job chart
        run: |
          if [ -d "charts/cron-job" ]; then
            echo "Testing cron-job chart..."
            helm install test-cronjob charts/cron-job \
              --set image.repository=busybox \
              --set image.tag=1.36 \
              --set 'command[0]=/bin/sh' \
              --set 'command[1]=-c' \
              --set 'args[0]=echo "Test CronJob"' \
              --wait --timeout 2m

            kubectl get cronjob test-cronjob-cron-job
            kubectl create job --from=cronjob/test-cronjob-cron-job manual-test-job
            kubectl wait --for=condition=complete --timeout=60s job/manual-test-job
            kubectl logs job/manual-test-job

            helm uninstall test-cronjob
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/
          framework: kubernetes
          quiet: true
          soft_fail: true

  chart-metadata:
    name: Validate Chart Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate all charts
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Validating $chart_name..."

              # Validate required fields
              grep -q "apiVersion:" "$chart/Chart.yaml" || { echo "Missing apiVersion in $chart_name"; exit 1; }
              grep -q "name:" "$chart/Chart.yaml" || { echo "Missing name in $chart_name"; exit 1; }
              grep -q "version:" "$chart/Chart.yaml" || { echo "Missing version in $chart_name"; exit 1; }
              grep -q "type:" "$chart/Chart.yaml" || { echo "Missing type in $chart_name"; exit 1; }

              # Check values.yaml exists
              if [ ! -f "$chart/values.yaml" ]; then
                echo "values.yaml not found in $chart_name"
                exit 1
              fi

              echo "✓ $chart_name validation passed"
            fi
          done
