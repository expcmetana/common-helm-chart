name: Lint and Test

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"
  push:
    branches:
      - main
      - develop
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint charts/

  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint cron-job chart
        run: |
          helm lint charts/cron-job --strict

      - name: Template cron-job chart
        run: |
          helm template test-release charts/cron-job \
            --set image.repository=busybox \
            --set image.tag=latest \
            --set 'command[0]=/bin/sh' \
            --set 'args[0]=echo test'

  test-install:
    name: Test Chart Installation
    runs-on: ubuntu-latest
    needs: [lint-yaml, lint-helm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s

      - name: Install cron-job chart
        run: |
          helm install test-cronjob charts/cron-job \
            --set image.repository=busybox \
            --set image.tag=1.36 \
            --set 'command[0]=/bin/sh' \
            --set 'command[1]=-c' \
            --set 'args[0]=echo "Test CronJob"' \
            --wait --timeout 2m

      - name: Verify CronJob
        run: |
          kubectl get cronjob test-cronjob-cron-job
          kubectl describe cronjob test-cronjob-cron-job

      - name: Trigger manual job
        run: |
          kubectl create job --from=cronjob/test-cronjob-cron-job manual-test-job
          kubectl wait --for=condition=complete --timeout=60s job/manual-test-job

      - name: Check job logs
        run: |
          kubectl logs job/manual-test-job

      - name: Cleanup
        if: always()
        run: |
          helm uninstall test-cronjob || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/
          framework: kubernetes
          quiet: true
          soft_fail: true

  chart-metadata:
    name: Validate Chart Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Chart.yaml
        run: |
          if [ ! -f charts/cron-job/Chart.yaml ]; then
            echo "Chart.yaml not found"
            exit 1
          fi

          # Validate required fields
          grep -q "apiVersion:" charts/cron-job/Chart.yaml || exit 1
          grep -q "name:" charts/cron-job/Chart.yaml || exit 1
          grep -q "version:" charts/cron-job/Chart.yaml || exit 1
          grep -q "type:" charts/cron-job/Chart.yaml || exit 1

          echo "Chart.yaml validation passed"

      - name: Check values.yaml exists
        run: |
          if [ ! -f charts/cron-job/values.yaml ]; then
            echo "values.yaml not found"
            exit 1
          fi
          echo "values.yaml exists"
