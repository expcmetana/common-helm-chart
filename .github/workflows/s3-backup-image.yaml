name: s3-backup-image

on:
  push:
    branches: [main]
    paths:
      - "charts/cron-job/docker/s3-backup/**"
      - ".github/workflows/s3-backup-image.yaml"
  # pull_request:
  #   paths:
  #     - "charts/cron-job/docker/s3-backup/**"
  #     - ".github/workflows/s3-backup-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY_HOST: registry.digitalocean.com
  IMAGE_NAME: ${{ secrets.CONTAINER_REGISTRY }}/s3-backup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Extract versions
        id: version
        run: |
          AWS_VERSION=$(grep '^FROM amazon/aws-cli:' charts/cron-job/docker/s3-backup/Dockerfile | cut -d':' -f2)
          CHART_VERSION=$(grep '^version:' charts/cron-job/Chart.yaml | awk '{print $2}')
          echo "aws_version=${AWS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "AWS CLI version: ${AWS_VERSION}"
          echo "Chart version: ${CHART_VERSION}"

      - name: Compute docker tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          AWS_VERSION="${{ steps.version.outputs.aws_version }}"
          CHART_VERSION="${{ steps.version.outputs.chart_version }}"
          TAGS="${{ env.IMAGE_NAME }}:${CHART_VERSION},${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:aws-${AWS_VERSION},${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Docker tags: ${TAGS}"

      - name: Build (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: charts/cron-job/docker/s3-backup
          file: charts/cron-job/docker/s3-backup/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=s3-backup
          cache-to: type=gha,mode=max,scope=s3-backup

      - name: Build & push (main / manual)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: charts/cron-job/docker/s3-backup
          file: charts/cron-job/docker/s3-backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=s3-backup
          cache-to: type=gha,mode=max,scope=s3-backup

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image pushed with tags ${{ steps.tags.outputs.tags }}"
